name: Release
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: 386
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: 386
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euxo pipefail
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUTPUT="civ-tui-${GOOS}-${GOARCH}${EXT}"
          go build -ldflags="-s -w" -o "${OUTPUT}" .
          if [ "$GOOS" != "windows" ]; then
            tar czf "${OUTPUT}.tar.gz" "${OUTPUT}"
          else
            zip "${OUTPUT%.exe}.zip" "${OUTPUT}"
          fi

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG="${{ github.event.release.tag_name }}"
          shopt -s nullglob
          files=( *.tar.gz *.zip )
          [ ${#files[@]} -gt 0 ] || { echo "No release artifacts found"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber
